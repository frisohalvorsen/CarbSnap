<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- ── DUMBBELL (horizontal, centered) ─────────────── -->

  <!-- Left large plate -->
  <rect x="52"  y="186" width="52" height="140" rx="16" fill="white"/>
  <!-- Left small plate -->
  <rect x="108" y="206" width="30" height="100" rx="10" fill="rgba(255,255,255,0.75)"/>

  <!-- Handle / bar -->
  <rect x="138" y="232" width="236" height="48" rx="24" fill="white"/>

  <!-- Right small plate -->
  <rect x="374" y="206" width="30" height="100" rx="10" fill="rgba(255,255,255,0.75)"/>
  <!-- Right large plate -->
  <rect x="408" y="186" width="52" height="140" rx="16" fill="white"/>
</svg>
